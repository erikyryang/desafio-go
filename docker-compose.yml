# Local environment: PostgreSQL, Keycloak (IdP), LocalStack (SQS), migrations
# and three independent instances of the service (app1/app2/app3).
name: desafio-go

x-app-env: &app-env
  DATABASE_URL: postgres://wager:wager@postgres:5432/wager?sslmode=disable
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_WAGER_QUEUE_NAME: wager-transactions.fifo
  SQS_WAGER_DLQ_NAME: wager-transactions-dlq.fifo
  SQS_EVENTS_QUEUE_NAME: wallet-events.fifo
  OIDC_ISSUER: http://localhost:8080/realms/wager
  OIDC_JWKS_URL: http://keycloak:8080/realms/wager/protocol/openid-connect/certs
  OIDC_AUDIENCE: wager-api
  HTTP_ADDR: ":8081"
  LOG_LEVEL: info
  MIGRATE_ON_START: "false"
  PENDING_INITIAL_BACKOFF: 2s
  PENDING_MAX_ATTEMPTS: "8"
  PENDING_TTL: 10m
  SHUTDOWN_TIMEOUT: 25s

x-app: &app
  build: .
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy
    localstack:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8081/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 12
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager -d wager"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Fixed public hostname so every token carries the same issuer whether
      # it was requested from the host (localhost) or from the docker network.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./deploy/keycloak/wager-realm.json:/opt/keycloak/data/import/wager-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wallet-events.fifo >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30

  migrate:
    build: .
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://wager:wager@postgres:5432/wager?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1
    ports:
      - "8081:8081"

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2
    ports:
      - "8082:8081"

  app3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app3
    ports:
      - "8083:8081"

volumes:
  pgdata:
